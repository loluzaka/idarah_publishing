# firebase-admin 14 -> jwks-rsa 4 -> jose 6 (ESM-only) is loaded with require(),
# which needs Node >= 22.12. Pin both the build and the serverless function
# runtime so API routes don't fail with ERR_REQUIRE_ESM.
[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Google / Firebase sign-in. NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is idarahbooks.in, so
# the sign-in popup opens https://idarahbooks.in/__/auth/handler. Netlify has no such
# page, so proxy it to the Firebase-hosted handler. (A root-level _redirects file is
# not read for a Next.js site - only rules declared here are guaranteed to apply.)
[[redirects]]
  from = "/__/auth/*"
  to = "https://iadsite-d75c7.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Fingerprinted build output never changes -> cache for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unversioned public assets: cache a day, serve stale while revalidating.
[[headers]]
  for = "/logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/apple-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
